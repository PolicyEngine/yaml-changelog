name: Pull Request

on:
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    
    - name: Lint with flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=88 --statistics
    
    - name: Check formatting with black
      run: |
        black --check --line-length 88 .
    
    - name: Type check with mypy
      run: |
        mypy yaml_changelog --ignore-missing-imports || true  # Allow failures for now
    
    - name: Run pytest
      run: |
        pytest tests/ -v --tb=short

  check-changelog-entry:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Check for changelog entry
      run: |
        if [ -f "changelog_entry.yaml" ]; then
          echo "✅ changelog_entry.yaml found"
          
          # Validate it's valid YAML
          python -c "import yaml; yaml.safe_load(open('changelog_entry.yaml'))"
          echo "✅ changelog_entry.yaml is valid YAML"
          
          # Validate structure
          python -c "import yaml; entries = yaml.safe_load(open('changelog_entry.yaml')); assert entries, 'Empty file'; assert 'bump' in entries[0] or 'version' in entries[0], 'Missing bump/version'; print('✅ changelog_entry.yaml has valid structure')"
        else
          echo "⚠️  No changelog_entry.yaml found"
          echo "For feature changes, please add a changelog_entry.yaml file"
          echo ""
          echo "Example:"
          echo "- bump: patch"
          echo "  fixed:"
          echo "    - Description of fix"
          echo "  added:"
          echo "    - Description of new feature"
        fi