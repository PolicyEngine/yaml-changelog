name: Push
on:
  push:
    branches: [ main ]
jobs:
  Lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check formatting
        run: |
          pip install black
          black . -l 79 --check
  Publish:
    if: github.repository == 'policyengine/yaml-changelog'
    runs-on: ubuntu-latest
    # PyPI trusted publishing: uploads accepted only from this workflow in the
    # pypi environment (limited to main). No stored token.
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build package
        run: |
          pip install build
          python -m build
      - name: Publish a Python distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip_existing: true
